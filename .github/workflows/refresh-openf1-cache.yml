name: Refresh OpenF1 cache

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: openf1-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh cached OpenF1 data
        run: node scripts/refresh-openf1-cache.mjs

      - name: Commit cache updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "Refresh OpenF1 data cache"
            git push
          fi
